<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Neutral shell defaults. The Worker rewrites title, description, keywords,
         robots and every open-graph tag per route from the deployment identity
         (src/worker/html.ts), so nothing here names a product or company. -->
    <title>Universal Identifier — Verify products, news, websites and media with evidence</title>
    <meta
      name="description"
      content="A free, self-hostable verification engine for products, news claims, websites and media. Every report shows its evidence, sources, confidence and limitations."
    />
    <meta
      name="keywords"
      content="verification engine,counterfeit check,fact check,scam website checker,image verification,identifier check,universal api gateway"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Universal Identifier — evidence before conclusion" />
    <meta property="og:description" content="One platform for investigating authenticity across products, news, websites and digital media." />
    <meta property="og:url" content="" />
    <meta property="og:site_name" content="Universal Identifier" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000000'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='none' stroke='%23ff1744' stroke-width='1.5'/%3E%3Cpath d='M10 16.5 L14 20.5 L22 11.5' fill='none' stroke='%23ff1744' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body class="min-h-screen bg-ink-950 text-mist-200 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
